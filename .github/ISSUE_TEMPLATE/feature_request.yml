name: Feature request
description: Suggest a new operation, option or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How UniChef could do it. For a new operation, give its inputs, options and an example output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you have tried, such as a CyberChef recipe.
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Engine (operations, both cores)
        - Python CLI
        - npm library
        - Web app
        - Browser extension
        - Packaging
        - Documentation
