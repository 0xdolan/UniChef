# SPDX-License-Identifier: GPL-3.0-or-later
# CodeQL code scanning (PRD §11.6).
name: codeql

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # A private repository needs actions: read for CodeQL to read its own run.
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      # Code scanning is not enabled while the repository is private, so the results stay in the
      # run: kept as an artifact, and the job fails on any finding. Drop upload: never once it is.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
          if-no-files-found: ignore
      - name: Fail on findings
        run: |
          found=$(jq '[.runs[].results[]] | length' sarif/*.sarif | awk '{n += $1} END {print n + 0}')
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif/*.sarif
          if (( found > 0 )); then
            echo "::error::CodeQL found $found result(s)"
            exit 1
          fi
