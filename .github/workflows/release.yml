# SPDX-License-Identifier: GPL-3.0-or-later
# Release on a version tag (PRD §11.4, §10.3). Artefacts for parts that do not exist yet
# (web zip, orig tarball, extension zips) are added as those parts land.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PY_DIR: packages/python-cli

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag is SemVer and equals VERSION
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N."
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$version" != "$(cat VERSION)" ]]; then
            echo "::error::Tag '$TAG' does not match VERSION ($(cat VERSION))."
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: A stable tag is on main
        if: steps.tag.outputs.prerelease == 'false'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Stable tags must point at a commit on main."; exit 1; }
      - name: The tag is signed and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [[ $(jq -r .object.type <<< "$ref") != tag ]]; then
            echo "::error::'$TAG' is a lightweight tag; create it with git tag -s."
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<< "$ref")" \
            -q .verification.verified)
          [[ "$verified" == true ]] || { echo "::error::Tag '$TAG' has no verified signature."; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Every file agrees with VERSION (REL-001)
        run: uv run scripts/version/check.py

  build-all:
    name: build-all
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Python sdist and wheel
        working-directory: ${{ env.PY_DIR }}
        run: |
          uv build --out-dir ../../dist/python
          rm -f ../../dist/python/.gitignore
          uvx twine check --strict ../../dist/python/*
      - name: npm tarball
        run: |
          pnpm --filter @unichef/core build
          mkdir -p dist/npm
          pnpm --filter @unichef/core pack --pack-destination "$PWD/dist/npm"
      - name: SBOM (Python)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.PY_DIR }}
          format: cyclonedx-json
          output-file: dist/sbom/unichef-python.cdx.json
          upload-artifact: false
      - name: SBOM (npm)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: packages/npm-core
          format: cyclonedx-json
          output-file: dist/sbom/unichef-core-npm.cdx.json
          upload-artifact: false
      - name: SHA256SUMS
        working-directory: dist
        run: find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: attest
    needs: build-all
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/python/*
            dist/npm/*.tgz

  pypi:
    name: pypi
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/unichef/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/python/

  npm:
    name: npm
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/@unichef/core/v/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishes the attested tarball itself. npm trusted publishing (OIDC) needs no token
      # once configured on npmjs.com; NPM_TOKEN covers the first publish of a new package.
      - name: Publish @unichef/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish dist/npm/*.tgz --provenance --access public --tag "$DIST_TAG"

  ghcr:
    name: ghcr
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the runtime image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tags=(-t "ghcr.io/0xdolan/unichef:$VERSION")
          [[ "$PRERELEASE" == false ]] && tags+=(-t ghcr.io/0xdolan/unichef:latest)
          docker buildx build --platform linux/amd64,linux/arm64 --target runtime --push \
            "${tags[@]}" -f docker/Dev.Dockerfile .

  github-release:
    name: github-release
    needs: [verify, pypi, npm, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' \
            CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "::error::CHANGELOG.md has no section for $VERSION."; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: UniChef ${{ needs.verify.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: |
            dist/python/*
            dist/npm/*.tgz
            dist/sbom/*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
