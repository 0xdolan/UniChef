[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "unichef"
dynamic = ["version"]
description = "Unicode character analysis and deterministic data-transformation recipes for the terminal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "0xdolan" }]
keywords = ["unicode", "cyberchef", "encoding", "security", "cli", "homoglyph", "bidi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  "rich>=13.7",
  "regex>=2023.12.25",
  "cryptography>=41.0",
]

[project.urls]
Homepage = "https://0xdolan.github.io/unichef/"
Source = "https://github.com/0xdolan/unichef"
Issues = "https://github.com/0xdolan/unichef/issues"
Changelog = "https://github.com/0xdolan/unichef/blob/main/CHANGELOG.md"

[project.scripts]
unichef = "unichef.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/unichef/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unichef"]

[tool.hatch.build.targets.sdist]
include = ["src/unichef", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "PL", "PERF", "RUF", "S", "T20", "ANN"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "RUF001", "S"]

[tool.ruff.lint.isort]
known-first-party = ["unichef"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["regex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=unichef --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["parity: shared vector tests", "conformance: UCD conformance tests", "slow: long-running"]
